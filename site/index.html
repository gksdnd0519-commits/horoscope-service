<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>별빛 운세</title>
  <meta name="description" content="생년월일만 넣으면 내 별자리와 오늘의 운세, 궁합까지 한 번에 보는 무료 별자리 운세">
  <meta property="og:title" content="별빛 운세 — 오늘의 별자리 운세">
  <meta property="og:description" content="생년월일로 내 별자리 찾고 오늘의 운세·궁합 보기">
  <meta name="theme-color" content="#14122b">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="hero">
    <p class="eyebrow" id="today-label"></p>
    <h1>별빛 운세</h1>
    <p class="lead">생년월일로 내 별자리를 찾고 오늘의 운세를 확인하세요.</p>

    <form id="birth-form" class="birth-form" autocomplete="off">
      <label>
        <span>태어난 달</span>
        <select id="birth-month" required></select>
      </label>
      <label>
        <span>태어난 날</span>
        <select id="birth-day" required></select>
      </label>
      <button type="submit" class="btn-primary">운세 보기</button>
    </form>
  </header>

  <main>
    <section aria-labelledby="pick-title">
      <h2 id="pick-title" class="section-title">또는 별자리 직접 선택</h2>
      <div id="sign-grid" class="sign-grid" role="list"></div>
    </section>

    <section id="result" class="result" hidden>
      <div class="result-head">
        <span class="result-symbol" id="result-symbol" aria-hidden="true"></span>
        <div>
          <h2 id="result-name"></h2>
          <p class="muted" id="result-meta"></p>
        </div>
        <button type="button" class="btn-ghost" id="share-btn">링크 복사</button>
      </div>

      <div class="tabs" role="tablist">
        <button role="tab" data-tab="today" aria-selected="true">오늘의 운세</button>
        <button role="tab" data-tab="profile" aria-selected="false">별자리 프로필</button>
        <button role="tab" data-tab="match" aria-selected="false">궁합</button>
      </div>

      <div class="panel" data-panel="today"></div>
      <div class="panel" data-panel="profile" hidden></div>
      <div class="panel" data-panel="match" hidden>
        <label class="match-pick">
          <span>상대 별자리</span>
          <select id="match-select"></select>
        </label>
        <div id="match-result"></div>
      </div>
    </section>
  </main>

  <footer>
    <p>별빛 운세는 재미로 보는 콘텐츠입니다. 중요한 결정은 스스로의 판단을 믿으세요.</p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
